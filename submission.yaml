submission:
  title: "MedBrief AI"                               

  problem_statement: >                 
    Clinicians spend up to two hours daily reading and summarising complex patient records. Important events and medication changes can be buried in
    unstructured notes, leading to avoidable readmissions.

  solution_summary: >                  
    MedBrief is a clinical documentation assistant that helps clinicians review patient records and prepare evidence-linked summaries. It provides a clear 
    timeline, highlights medication changes, and references sources directly.

  key_features:                        
    - "Import clinical notes to generate summaries for ward rounds, referrals, and discharges"
    - "Extract and present a chronological timeline of clinical events"
    - "Identify and highlight medication changes and outstanding investigations"
    - "Direct source document referencing for clinician verification and safety"
    - "IBM Bob MCP Server integration for AI-powered summarisation workflows"

  tech_stack:
  languages:
    - "TypeScript"
    - "JavaScript"
    - "HTML"
    - "CSS"

  frameworks:
    - "React"
    - "Vite"

  ibm_technologies:
    - "IBM Bob"
    - "watsonx.ai"

  databases:
    - "PostgreSQL"

  other:
    - "MCP (Model Context Protocol)"

  what_we_are_most_proud_of: >         
    The strict adherence to clinical safety, ensuring AI-generated facts are cross-referenced 
    with original source documents to prevent hallucinations and maintain clinician oversight.

  known_limitations: >
  The system depends on the quality and completeness of the available medical records, and OCR may be less accurate for poor-quality scans or handwritten notes.
  AI-generated summaries may require doctor verification, as the system is designed to assist clinical decision-making rather than replace medical professionals.
  

