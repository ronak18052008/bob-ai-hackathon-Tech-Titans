submission:
  title: "MedBrief AI"                               

  problem_statement: >                 
    Clinicians spend up to two hours daily reading and summarising complex patient records. 
    Important events and medication changes can be buried in unstructured notes, leading to avoidable readmissions.

  solution_summary: >                  
    MedBrief is a clinical documentation assistant that helps clinicians review patient records and prepare evidence-linked summaries. 
    It provides a clear timeline, highlights medication changes, and references sources directly.

  key_features:                        
    - "Import clinical notes to generate summaries for ward rounds, referrals, and discharges"
    - "Extract and present a chronological timeline of clinical events"
    - "Identify and highlight medication changes and outstanding investigations"
    - "Direct source document referencing for clinician verification and safety"
    - "IBM Bob MCP Server integration for AI-powered summarisation workflows"

  tech_stack:
  languages:
    - "TypeScript"
    - "JavaScript"
    - "HTML"
    - "CSS"

  frameworks:
    - "React"
    - "Vite"

  ibm_technologies:
    - "IBM Bob"
    - "watsonx.ai"

  databases:
    - "PostgreSQL"

  other:
    - "MCP (Model Context Protocol)"

  what_we_are_most_proud_of: >         
    The strict adherence to clinical safety, ensuring AI-generated facts are cross-referenced 
    with original source documents to prevent hallucinations and maintain clinician oversight.

  known_limitations: >
  The current demonstration uses synthetic and sample medical data and does not
  process real patient-identifiable health information (PHI). AI-generated
  summaries are intended to assist clinicians and do not replace professional
  medical judgment or clinical decision-making. Summary quality depends on the
  completeness, accuracy, and structure of the input records, and complex or
  ambiguous medical information may require additional clinician verification.
  The current prototype is not a production-grade healthcare deployment and
  would require additional security, privacy, compliance, authentication, and
  audit controls before real-world use. Full live IBM Bob and watsonx.ai
  functionality requires properly configured credentials and backend services.

