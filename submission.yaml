submission:
  title: "MedSynapse AI"                       # REQUIRED — Project display name

  problem_statement: >                         # REQUIRED — 1-3 sentences. What problem? Who has it?
    Clinicians spend 15 to 35 minutes per patient manually reviewing dozens of fragmented, unstructured medical documents across prior hospitalizations. Critical medication dosage shifts, missing investigation reports, and contradictory clinical notes frequently go unnoticed, driving cognitive overload and preventable medical errors.

  solution_summary: >                          # REQUIRED — 1-3 sentences. What did you build?
    MedSynapse AI transforms fragmented medical records into a structured longitudinal patient journey, interactive knowledge graph, evidence-backed clinical summary, medication evolution timeline, and automated documentation gap radar—with 100% of claims anchored to page coordinates without hallucination.

  key_features:                                # REQUIRED — List 3 to 5 specific features you implemented
    - "First-class Medical Document Scan & Multimodal OCR Summarizer with coordinate-level source citations"
    - "Signature Longitudinal Patient Journey Reconstruction & Relational Knowledge Graph"
    - "Clinical Change Lens & Chronological Medication Evolution Tracker (Started, Dose Changed, Stopped)"
    - "Surveillance Gap Radar & Cross-Record Documentation Conflict Detector"
    - "Synchronized 3-Panel Synapse View with Context-Aware Clinical Copilot & Pre-Export Second Look Audit"

  tech_stack:
    languages: ["Python", "TypeScript", "SQL"]
    frameworks: ["FastAPI", "React 18", "Vite", "Tailwind CSS"]
    ibm_technologies: ["watsonx.ai", "IBM Granite Foundation Models", "IBM Bob Agentic Framework"]
    databases: ["SQLite", "PostgreSQL-ready", "SQLAlchemy ORM"]
    other: ["Tesseract OCR", "Pytest", "Docker", "GitHub Actions"]

  what_we_are_most_proud_of: >                 # Optional but recommended
    The synchronized 3-Panel Synapse View and Evidence-First architecture. Every single clinical fact links directly to Document ID, Page Number, and Section Text, preventing AI hallucinations while reconstructing complex multi-encounter patient journeys in under 3 seconds.

  known_limitations: >                         # Optional but recommended
    Handwritten cursive prescriptions with severe paper degradation trigger an explicit 'Low-Confidence Text — Review Required' warning rather than guessing ungrounded text. Multi-language translation currently supports 6 Indian clinical languages with full English medical terminology grounding.

